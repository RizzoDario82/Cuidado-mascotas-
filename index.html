
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuidado-mascotas</title>
  
  <!-- CDN de Supabase CDN correctamente cerrado -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background: #f4f8f5;
      color: #24352a;
      padding-bottom: 40px;
    }
    header {
      background: linear-gradient(135deg, #2e7d32, #1b5e20);
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 1.2rem;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 15px;
    }
    .welcome {
      text-align: center;
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-top: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .welcome img {
      width: 100%;
      max-width: 350px;
      border-radius: 12px;
      margin-bottom: 10px;
    }
    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 20px;
    }
    .card-btn {
      background: white;
      border: 1px solid #e0e0e0;
      padding: 20px 10px;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      transition: transform 0.1s ease;
    }
    .card-btn:active {
      transform: scale(0.98);
      background: #f0f7f2;
    }
    .card-btn .icon {
      font-size: 2.2rem;
    }
    .card-btn h3 {
      font-size: 0.95rem;
      margin-top: 8px;
      color: #2e7d32;
    }
    .status {
      text-align: center;
      margin-top: 20px;
      padding: 10px;
      font-size: 0.85rem;
      background: #e8f5e9;
      color: #2e7d32;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <header>
    🐾 <strong>Cuidado-mascotas</strong>
    <p style="font-size: 0.8rem; opacity: 0.9;">Todo el cuidado de tu mascota en un solo lugar</p>
  </header>

  <main class="container">
    <section class="welcome">
      <img src="1787704794272.png" alt="PetCare Portada">
      <h2>¡Bienvenido a PetCare! 🐶🐱</h2>
      <p style="font-size: 0.85rem; color: #666; margin-top: 5px;">
        Cuidar es amar. Encuentra servicios, cuidadores y soluciones para el bienestar de tu mascota.
      </p>
    </section>

    <!-- Botones interactivos -->
    <section class="cards">
      <button class="card-btn" onclick="abrirMisMascotas()">
        <div class="icon">🐶</div>
        <h3>Mis mascotas</h3>
      </button>

      <button class="card-btn" onclick="abrirServicios()">
        <div class="icon">🩺</div>
        <h3>Servicios</h3>
      </button>

      <button class="card-btn" onclick="abrirCuidadores()">
        <div class="icon">❤️</div>
        <h3>Cuidadores</h3>
      </button>

      <button class="card-btn" onclick="abrirMensajes()">
        <div class="icon">💬</div>
        <h3>Mensajes</h3>
      </button>
    </section>

    <div id="estado" class="status">
      🟢 Conectado correctamente con Supabase
    </div>
  </main>

  <script>
    // Manejador global para detectar cualquier error visualmente
    window.onerror = function(msg, url, line) {
      alert("Error JS: " + msg + " (Línea " + line + ")");
      return false;
    };

    // CONEXIÓN A SUPABASE
    const SUPABASE_URL = "https://aahvlspsndedmsllceze.supabase.co"; 
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFhaHZsc3BzbmRlZG1zbGxjZXplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDAwMzUzNzUsImV4cCI6MjA1NTYxMTM3NX0.B_HInX_BvIsbYvR0e0gVz6Z8S6O-X7874g7M6R76O4Q"; 
    const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    function obtenerContenedor() {
      let cont = document.getElementById("adminContenido");
      if (!cont) {
        cont = document.createElement("div");
        cont.id = "adminContenido";
        document.body.appendChild(cont);
      }
      cont.style.display = "block";
      cont.style.padding = "15px";
      cont.style.margin = "20px auto";
      cont.style.maxWidth = "570px";
      cont.style.background = "#ffffff";
      cont.style.borderRadius = "10px";
      cont.style.boxShadow = "0 4px 10px rgba(0,0,0,0.1)";
      cont.style.color = "#333";
      cont.scrollIntoView({ behavior: "smooth" });
      return cont;
    }

    function mostrarError(cont, msg) {
      cont.innerHTML = `<p style="color:red; background:#fee; padding:10px; border-radius:5px;">❌ Error: ${msg}</p>`;
    }

    async function abrirMisMascotas() {
      const contenedor = obtenerContenedor();
      contenedor.innerHTML = "<p>⏳ Cargando mascotas...</p>";

      if (!supabase) return mostrarError(contenedor, "Supabase no se ha inicializado.");

      const { data: mascotas, error } = await supabase.from('mascotas').select('*');
      if (error) return mostrarError(contenedor, error.message);

      let html = `
        <h3>🐾 Mis Mascotas</h3>
        <button onclick="mostrarFormularioMascota()" style="background: #2e7d32; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; margin: 10px 0;">+ Agregar Mascota</button>
        <div id="formularioModulo"></div>
      `;

      if (!mascotas || mascotas.length === 0) {
        html += "<p>No hay mascotas registradas.</p>";
      } else {
        html += "<ul style='list-style: none; padding: 0;'>";
        mascotas.forEach(m => {
          html += `<li style='border-bottom: 1px solid #eee; padding: 8px 0;'><strong>${m.nombre}</strong> - ${m.especie || 'Mascota'} (${m.raza || 'Sin raza'})</li>`;
        });
        html += "</ul>";
      }
      contenedor.innerHTML = html;
    }

    function mostrarFormularioMascota() {
      document.getElementById("formularioModulo").innerHTML = `
        <form onsubmit="guardarMascota(event)" style="display: flex; flex-direction: column; gap: 8px; margin-top: 10px; background: #f9f9f9; padding: 10px; border-radius: 8px;">
          <input type="text" id="nombreMascota" placeholder="Nombre" required style="padding: 8px;" />
          <input type="text" id="especieMascota" placeholder="Especie (Ej: Perro, Gato)" required style="padding: 8px;" />
          <input type="text" id="razaMascota" placeholder="Raza" style="padding: 8px;" />
          <button type="submit" style="background: #1b5e20; color: white; border: none; padding: 8px; border-radius: 5px; cursor: pointer;">Guardar</button>
        </form>`;
    }

    async function guardarMascota(e) {
      e.preventDefault();
      const nombre = document.getElementById("nombreMascota").value;
      const especie = document.getElementById("especieMascota").value;
      const raza = document.getElementById("razaMascota").value;

      const { error } = await supabase.from('mascotas').insert([{ nombre, especie, raza }]);
      if (error) alert("Error: " + error.message);
      else { alert("¡Mascota agregada!"); abrirMisMascotas(); }
    }

    async function abrirServicios() {
      const contenedor = obtenerContenedor();
      contenedor.innerHTML = "<p>⏳ Cargando servicios...</p>";

      if (!supabase) return mostrarError(contenedor, "Supabase no se ha inicializado.");

      const { data: servicios, error } = await supabase.from('servicios').select('*');
      if (error) return mostrarError(contenedor, error.message);

      let html = `<h3>🩺 Servicios Disponibles</h3>`;
      if (!servicios || servicios.length === 0) {
        html += "<p>No hay servicios registrados por ahora.</p>";
      } else {
        html += "<ul style='list-style: none; padding: 0;'>";
        servicios.forEach(s => {
          html += `<li style='border-bottom: 1px solid #eee; padding: 8px 0;'><strong>${s.nombre || s.titulo}</strong><br><small>${s.descripcion || ''}</small></li>`;
        });
        html += "</ul>";
      }
      contenedor.innerHTML = html;
    }

    async function abrirCuidadores() {
      const contenedor = obtenerContenedor();
      contenedor.innerHTML = "<p>⏳ Cargando cuidadores...</p>";

      if (!supabase) return mostrarError(contenedor, "Supabase no se ha inicializado.");

      const { data: cuidadores, error } = await supabase.from('profiles').select('*');
      if (error) return mostrarError(contenedor, error.message);

      let html = `<h3>❤️ Cuidadores Verificados</h3>`;
      if (!cuidadores || cuidadores.length === 0) {
        html += "<p>No hay cuidadores registrados.</p>";
      } else {
        html += "<ul style='list-style: none; padding: 0;'>";
        cuidadores.forEach(c => {
          html += `<li style='border-bottom: 1px solid #eee; padding: 8px 0;'><strong>${c.nombre || c.email}</strong> (${c.rol || 'Usuario'})</li>`;
        });
        html += "</ul>";
      }
      contenedor.innerHTML = html;
    }

    async function abrirMensajes() {
      const contenedor = obtenerContenedor();
      contenedor.innerHTML = "<p>⏳ Cargando mensajes...</p>";

      if (!supabase) return mostrarError(contenedor, "Supabase no se ha inicializado.");

      const { data: mensajes, error } = await supabase.from('mensajes').select('*');
      if (error) return mostrarError(contenedor, error.message);

      let html = `<h3>💬 Mensajes y Notificaciones</h3>`;
      if (!mensajes || mensajes.length === 0) {
        html += "<p>No tienes mensajes nuevos.</p>";
      } else {
        html += "<ul style='list-style: none; padding: 0;'>";
        mensajes.forEach(m => {
          html += `<li style='border-bottom: 1px solid #eee; padding: 8px 0;'>${m.contenido || m.texto}</li>`;
        });
        html += "</ul>";
      }
      contenedor.innerHTML = html;
    }
  </script>
</body>
</html>

     <div id="resultado" style="margin: 20px auto; max-width: 500px; padding: 15px; background: white; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: none;"></div>

<script>
  const SUPABASE_URL = "https://aahvlspsndedmsllceze.supabase.co"; 
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFhaHZsc3BzbmRlZG1zbGxjZXplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDAwMzUzNzUsImV4cCI6MjA1NTYxMTM3NX0.B_HInX_BvIsbYvR0e0gVz6Z8S6O-X7874g7M6R76O4Q"; 
  
  // Inicialización limpia
  const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

  async function cargarModulo(nombreTabla, titulo) {
    const resDiv = document.getElementById("resultado");
    resDiv.style.display = "block";
    resDiv.innerHTML = `<p>⏳ Consultando ${titulo}...</p>`;
    resDiv.scrollIntoView({ behavior: "smooth" });

    if (!supabase) {
      resDiv.innerHTML = `<p style="color:red;">❌ La librería de Supabase no ha cargado.</p>`;
      return;
    }

    try {
      const { data, error } = await supabase.from(nombreTabla).select('*');
      
      if (error) {
        resDiv.innerHTML = `<p style="color:red;">❌ Error de Supabase: ${error.message}</p>`;
        return;
      }

      let html = `<h3>${titulo}</h3>`;
      if (!data || data.length === 0) {
        html += `<p>No hay datos registrados en <strong>${nombreTabla}</strong>.</p>`;
      } else {
        html += "<ul>";
        data.forEach(item => {
          html += `<li>${JSON.stringify(item)}</li>`;
        });
        html += "</ul>";
      }
      resDiv.innerHTML = html;
    } catch (err) {
      resDiv.innerHTML = `<p style="color:red;">❌ Error inesperado: ${err.message}</p>`;
    }
  }

  // Funciones asignadas a los botones
  function abrirMisMascotas() { cargarModulo('mascotas', '🐾 Mis Mascotas'); }
  function abrirServicios() { cargarModulo('servicios', '🩺 Servicios'); }
  function abrirCuidadores() { cargarModulo('profiles', '❤️ Cuidadores'); }
  function abrirMensajes() { cargarModulo('mensajes', '💬 Mensajes'); }
</script>
